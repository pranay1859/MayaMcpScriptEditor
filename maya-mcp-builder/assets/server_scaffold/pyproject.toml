[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-mcp"
version = "0.1.0"
description = "MCP server for Autodesk Maya, running inside Maya via FastMCP."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
]

[tool.setuptools.packages.find]
include = ["maya_mcp*"]
